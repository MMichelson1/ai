<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0A2A4F"/>
      <stop offset="1" stop-color="#14417B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.55">
      <stop offset="0" stop-color="#3C7FC4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3C7FC4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#04162B" flood-opacity="0.45"/>
    </filter>
    <path id="spark" d="M0,-11 C1.5,-3.5 3.5,-1.5 11,0 C3.5,1.5 1.5,3.5 0,11 C-1.5,3.5 -3.5,1.5 -11,0 C-3.5,-1.5 -1.5,-3.5 0,-11 Z"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="1200" fill="url(#bg)"/>
  <rect width="1200" height="1200" fill="url(#glow)"/>
  <g fill="#8EC9F5" opacity="0.18">
    <circle cx="90" cy="180" r="5"/><circle cx="1120" cy="240" r="4"/>
    <circle cx="1150" cy="760" r="5"/><circle cx="60" cy="900" r="4"/>
    <circle cx="180" cy="1060" r="4"/><circle cx="1060" cy="1080" r="4"/>
  </g>

  <!-- header -->
  <g text-anchor="middle">
    <rect x="330" y="52" width="540" height="52" rx="26" fill="none" stroke="#4FA3E3" stroke-width="2.5"/>
    <text x="600" y="87" font-size="23" letter-spacing="4.5" fill="#A9D4F5" font-weight="bold">AN AI COLLECTIVE WORKSHOP</text>
    <text x="600" y="196" font-size="88" font-weight="bold" fill="#FFFFFF">AI Fundamentals <tspan font-size="46" font-weight="normal" fill="#8EC9F5">for</tspan></text>
    <text x="600" y="292" font-size="88" font-weight="bold" fill="#FFFFFF">Qualitative Researchers</text>
  </g>

  <!-- dotted flow arcs from data toward the lens -->
  <g fill="none" stroke="#6FB6EE" stroke-width="3.5" stroke-dasharray="1 14" stroke-linecap="round" opacity="0.75">
    <path d="M 300 420 Q 520 340 800 430"/>
    <path d="M 265 660 Q 460 560 806 490"/>
    <path d="M 360 860 Q 560 760 815 545"/>
    <path d="M 940 640 Q 960 560 962 505"/>
  </g>

  <!-- left cards -->
  <!-- interview card -->
  <g transform="rotate(-6 190 402)" filter="url(#shadow)">
    <rect x="90" y="330" width="200" height="145" rx="18" fill="#FFFFFF"/>
    <circle cx="148" cy="412" r="19" fill="#4FA3E3"/>
    <path d="M 120 462 Q 148 432 176 462 Z" fill="#4FA3E3"/>
    <circle cx="232" cy="412" r="19" fill="#16406F"/>
    <path d="M 204 462 Q 232 432 260 462 Z" fill="#16406F"/>
    <rect x="152" y="348" width="76" height="34" rx="17" fill="#8EC9F5"/>
    <path d="M 176 380 L 170 392 L 190 381 Z" fill="#8EC9F5"/>
    <circle cx="172" cy="365" r="4" fill="#0F3460"/><circle cx="190" cy="365" r="4" fill="#0F3460"/><circle cx="208" cy="365" r="4" fill="#0F3460"/>
  </g>

  <!-- transcript page -->
  <g transform="rotate(5 165 645)" filter="url(#shadow)">
    <rect x="80" y="540" width="170" height="210" rx="12" fill="#FFFFFF"/>
    <rect x="100" y="562" width="80" height="12" rx="6" fill="#16406F"/>
    <rect x="100" y="592" width="130" height="10" rx="5" fill="#B7D8F3"/>
    <rect x="100" y="616" width="112" height="10" rx="5" fill="#B7D8F3"/>
    <rect x="100" y="640" width="130" height="14" rx="7" fill="#4FA3E3"/>
    <rect x="100" y="668" width="96" height="10" rx="5" fill="#B7D8F3"/>
    <rect x="100" y="692" width="124" height="10" rx="5" fill="#B7D8F3"/>
    <rect x="100" y="716" width="72" height="10" rx="5" fill="#B7D8F3"/>
  </g>

  <!-- audio waveform card -->
  <g transform="rotate(-4 250 882)" filter="url(#shadow)">
    <rect x="150" y="830" width="200" height="105" rx="16" fill="#0F3460"/>
    <g fill="#6FB6EE">
      <rect x="176" y="872" width="9" height="22" rx="4.5"/>
      <rect x="192" y="862" width="9" height="42" rx="4.5"/>
      <rect x="208" y="850" width="9" height="66" rx="4.5"/>
      <rect x="224" y="866" width="9" height="34" rx="4.5"/>
      <rect x="240" y="846" width="9" height="74" rx="4.5"/>
      <rect x="256" y="858" width="9" height="50" rx="4.5"/>
      <rect x="272" y="870" width="9" height="26" rx="4.5"/>
      <rect x="288" y="856" width="9" height="54" rx="4.5"/>
      <rect x="304" y="866" width="9" height="34" rx="4.5"/>
      <rect x="320" y="874" width="9" height="18" rx="4.5"/>
    </g>
  </g>

  <!-- right cards -->
  <!-- video card -->
  <g transform="rotate(6 1010 397)" filter="url(#shadow)">
    <rect x="910" y="330" width="200" height="135" rx="16" fill="#16406F"/>
    <circle cx="1010" cy="397" r="34" fill="#FFFFFF"/>
    <path d="M 1000 380 L 1028 397 L 1000 414 Z" fill="#16406F"/>
    <circle cx="936" cy="354" r="7" fill="#4FA3E3"/>
    <rect x="952" y="348" width="54" height="12" rx="6" fill="#2A5E9E"/>
  </g>

  <!-- field photo (polaroid) -->
  <g transform="rotate(-5 1042 640)" filter="url(#shadow)">
    <rect x="955" y="540" width="175" height="200" rx="10" fill="#FFFFFF"/>
    <rect x="970" y="555" width="145" height="138" rx="6" fill="#8EC9F5"/>
    <circle cx="1092" cy="583" r="15" fill="#FFFFFF"/>
    <path d="M 970 693 L 1024 616 L 1062 668 L 1088 636 L 1115 693 Z" fill="#2A5E9E"/>
    <path d="M 970 693 L 1010 640 L 1044 693 Z" fill="#16406F"/>
    <rect x="985" y="708" width="90" height="11" rx="5.5" fill="#B7D8F3"/>
  </g>

  <!-- analysis chart card -->
  <g transform="rotate(4 1000 882)" filter="url(#shadow)">
    <rect x="905" y="825" width="190" height="115" rx="14" fill="#FFFFFF"/>
    <rect x="930" y="890" width="22" height="30" rx="4" fill="#8EC9F5"/>
    <rect x="962" y="872" width="22" height="48" rx="4" fill="#4FA3E3"/>
    <rect x="994" y="884" width="22" height="36" rx="4" fill="#8EC9F5"/>
    <rect x="1026" y="856" width="22" height="64" rx="4" fill="#16406F"/>
    <path d="M 928 866 L 966 846 L 1000 858 L 1042 838" fill="none" stroke="#4FA3E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- flying loose pages -->
  <g filter="url(#shadow)">
    <g transform="rotate(-16 400 360)">
      <rect x="374" y="328" width="52" height="66" rx="6" fill="#FFFFFF"/>
      <rect x="382" y="340" width="36" height="6" rx="3" fill="#B7D8F3"/>
      <rect x="382" y="354" width="28" height="6" rx="3" fill="#B7D8F3"/>
      <rect x="382" y="368" width="34" height="6" rx="3" fill="#B7D8F3"/>
    </g>
    <g transform="rotate(14 815 345)">
      <rect x="789" y="312" width="52" height="66" rx="6" fill="#FFFFFF"/>
      <rect x="797" y="324" width="36" height="6" rx="3" fill="#B7D8F3"/>
      <rect x="797" y="338" width="28" height="6" rx="3" fill="#B7D8F3"/>
      <rect x="797" y="352" width="34" height="6" rx="3" fill="#B7D8F3"/>
    </g>
    <g transform="rotate(-10 340 560)">
      <rect x="316" y="532" width="48" height="58" rx="6" fill="#DDEEFB"/>
      <rect x="324" y="544" width="32" height="6" rx="3" fill="#8EC9F5"/>
      <rect x="324" y="558" width="24" height="6" rx="3" fill="#8EC9F5"/>
    </g>
  </g>

  <!-- researcher -->
  <g>
    <!-- torso -->
    <path d="M 520 668 Q 520 636 556 630 L 644 630 Q 680 636 680 668 L 696 840 L 504 840 Z" fill="#3C7FC4"/>
    <path d="M 578 630 L 600 668 L 622 630 L 600 648 Z" fill="#FFFFFF"/>
    <!-- head -->
    <circle cx="600" cy="556" r="62" fill="#C9E4F9"/>
    <path d="M 538 548 Q 540 492 600 492 Q 660 492 662 548 Q 640 522 600 522 Q 560 522 538 548 Z" fill="#16406F"/>
    <circle cx="577" cy="560" r="16" fill="none" stroke="#0F3460" stroke-width="5"/>
    <circle cx="625" cy="560" r="16" fill="none" stroke="#0F3460" stroke-width="5"/>
    <line x1="593" y1="558" x2="609" y2="558" stroke="#0F3460" stroke-width="5"/>
    <path d="M 586 596 Q 600 606 614 596" fill="none" stroke="#0F3460" stroke-width="5" stroke-linecap="round"/>
    <!-- left arm to desk -->
    <path d="M 534 680 L 476 786" stroke="#3C7FC4" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="470" cy="794" r="19" fill="#C9E4F9"/>
    <!-- right arm raised with magnifier -->
    <path d="M 668 682 L 772 606" stroke="#3C7FC4" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="780" cy="600" r="20" fill="#C9E4F9"/>
    <line x1="788" y1="592" x2="852" y2="528" stroke="#0F3460" stroke-width="18" stroke-linecap="round"/>
    <circle cx="898" cy="482" r="88" fill="#FFFFFF" fill-opacity="0.13" stroke="#DDEEFB" stroke-width="13"/>
    <!-- magnified insight inside lens -->
    <rect x="852" y="446" width="92" height="13" rx="6.5" fill="#8EC9F5"/>
    <rect x="846" y="474" width="104" height="16" rx="8" fill="#FFFFFF"/>
    <rect x="856" y="504" width="84" height="13" rx="6.5" fill="#8EC9F5"/>
  </g>

  <!-- sparkles around lens -->
  <g fill="#DDEEFB">
    <use href="#spark" transform="translate(994 386) scale(1.5)"/>
    <use href="#spark" transform="translate(1008 540) scale(0.9)" fill="#8EC9F5"/>
    <use href="#spark" transform="translate(806 428) scale(1.0)" fill="#8EC9F5"/>
  </g>

  <!-- desk -->
  <g>
    <rect x="330" y="866" width="540" height="86" rx="10" fill="#123C6C"/>
    <rect x="300" y="834" width="600" height="36" rx="16" fill="#2A5E9E"/>
    <!-- paper stack -->
    <g filter="url(#shadow)">
      <rect x="356" y="806" width="96" height="14" rx="4" fill="#DDEEFB" transform="rotate(-2 404 813)"/>
      <rect x="352" y="792" width="100" height="14" rx="4" fill="#FFFFFF" transform="rotate(1 402 799)"/>
      <rect x="358" y="778" width="94" height="14" rx="4" fill="#DDEEFB" transform="rotate(-1 405 785)"/>
    </g>
    <!-- coffee -->
    <g>
      <rect x="484" y="794" width="40" height="42" rx="8" fill="#FFFFFF"/>
      <path d="M 524 802 Q 544 806 538 822 Q 534 832 524 828" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <path d="M 496 782 Q 500 772 496 764 M 512 782 Q 516 772 512 764" stroke="#8EC9F5" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- laptop -->
    <g>
      <rect x="706" y="742" width="118" height="82" rx="8" fill="#0F3460" stroke="#8EC9F5" stroke-width="4"/>
      <use href="#spark" transform="translate(765 783) scale(1.6)" fill="#6FB6EE"/>
      <path d="M 690 824 L 840 824 L 856 844 L 674 844 Z" fill="#2A5E9E"/>
    </g>
    <!-- sticky notes on desk front -->
    <rect x="560" y="886" width="44" height="44" rx="4" fill="#8EC9F5" transform="rotate(-4 582 908)"/>
    <rect x="616" y="890" width="44" height="44" rx="4" fill="#DDEEFB" transform="rotate(5 638 912)"/>
  </g>

  <!-- footer -->
  <g text-anchor="middle">
    <line x1="480" y1="1008" x2="720" y2="1008" stroke="#4FA3E3" stroke-width="3.5" stroke-linecap="round"/>
    <text x="600" y="1078" font-size="46" font-weight="bold" fill="#FFFFFF">Monday, July 20  •  5:30 – 8:30 PM</text>
    <text x="600" y="1136" font-size="35" fill="#8EC9F5">Improving  •  Alpharetta, GA</text>
  </g>
</svg>
