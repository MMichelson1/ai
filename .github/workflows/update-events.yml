# Refreshes event data from calendar feeds and deploys the site (event calendar
# + AI Fundamentals Workshop Builder) to GitHub Pages.
# Runs entirely on GitHub's servers with plain HTTP — no AI tokens are used, ever.
name: Update events & deploy site

on:
  schedule:
    - cron: "0 10 * * 0" # Sundays 6:00 am US Eastern (10:00 UTC during EDT)
  workflow_dispatch: {} # the "Refresh now" button (Actions tab, or the link in the calendar footer)
  push:
    paths:
      - "event-calendar/**"
      - "workshop-builder/**"
      - ".github/workflows/update-events.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Only run on the repo's default branch — the branch GitHub Pages publishes
    # from. This keeps feature-branch pushes from committing event data or
    # deploying to the live site.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the parser
        run: node event-calendar/scripts/fetch-events.mjs --self-test
      - name: Fetch, validate & classify events
        run: node event-calendar/scripts/fetch-events.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add event-calendar/data/events.json event-calendar/data/geocache.json
          git diff --cached --quiet || git commit -m "chore: refresh event data [skip ci]"
          git push
      - name: Assemble site (calendar at root + workshop builder at /workshop-builder/)
        run: |
          rm -rf _site
          cp -r event-calendar _site
          mkdir -p _site/workshop-builder
          cp workshop-builder/index.html _site/workshop-builder/index.html
          # (The scripts/ and README are intentionally NOT published.)
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
