<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Build a complete AI Fundamentals for Professionals workshop — Luma listing, agenda, slides, handouts, and AI context files — from a single audience selection. Self-contained, no tokens, works offline.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F172A">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workshop">
<title>AI Fundamentals Workshop Builder</title>
<style>
  :root{
    --bg:#0F172A; --surface:#131E33; --surface2:#0B1424; --raise:#1C2A44;
    --border:rgba(148,163,184,.16); --border-strong:rgba(148,163,184,.28);
    --text:#E7EDF6; --muted:#94A3B8; --faint:#64748B;
    --p1:#22B8D6; --p2:#A78BFA; --p3:#34D399;
    --p1-ink:#0891B2; --p2-ink:#7C3AED; --p3-ink:#059669;
    --amber:#D97706; --danger:#F87171; --ok:#34D399;
    --field:#0E1A2E; --field-focus:#12233d;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px -12px rgba(0,0,0,.6);
    --radius:10px; --radius-sm:7px;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  :root[data-theme="light"]{
    --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#EEF2F8; --raise:#FFFFFF;
    --border:#E2E8F0; --border-strong:#CBD5E1;
    --text:#1E293B; --muted:#475569; --faint:#94A3B8;
    --p1:#0891B2; --p2:#7C3AED; --p3:#059669;
    --p1-ink:#0891B2; --p2-ink:#7C3AED; --p3-ink:#059669;
    --field:#FFFFFF; --field-focus:#FFFFFF;
    --shadow:0 1px 2px rgba(15,23,42,.06), 0 10px 30px -18px rgba(15,23,42,.25);
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#F5F7FB; --surface:#FFFFFF; --surface2:#EEF2F8; --raise:#FFFFFF;
      --border:#E2E8F0; --border-strong:#CBD5E1;
      --text:#1E293B; --muted:#475569; --faint:#94A3B8;
      --p1:#0891B2; --p2:#7C3AED; --p3:#059669;
      --field:#FFFFFF; --field-focus:#FFFFFF;
      --shadow:0 1px 2px rgba(15,23,42,.06), 0 10px 30px -18px rgba(15,23,42,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F172A; --surface:#131E33; --surface2:#0B1424; --raise:#1C2A44;
    --border:rgba(148,163,184,.16); --border-strong:rgba(148,163,184,.28);
    --text:#E7EDF6; --muted:#94A3B8; --faint:#64748B;
    --p1:#22B8D6; --p2:#A78BFA; --p3:#34D399;
    --field:#0E1A2E; --field-focus:#12233d;
    --shadow:0 1px 0 rgba(255,255,255,.03), 0 8px 24px -12px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  ::selection{background:color-mix(in srgb,var(--p1) 35%,transparent)}

  /* ---------- shell ---------- */
  .app{min-height:100vh;display:flex;flex-direction:column}
  header.top{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    padding:12px 20px;background:color-mix(in srgb,var(--bg) 82%,transparent);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .glyph{width:30px;height:30px;border-radius:8px;flex:none;position:relative;background:var(--surface);border:1px solid var(--border-strong);display:grid;place-items:center}
  .glyph i{display:block;width:12px;height:12px;border-radius:3px;background:linear-gradient(135deg,var(--p1),var(--p2) 55%,var(--p3))}
  .brand h1{font-size:14px;font-weight:650;margin:0;letter-spacing:-.01em;line-height:1.1}
  .brand h1 span{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.02em}
  .top-actions{display:flex;align-items:center;gap:8px}

  .btn{font-family:inherit;font-size:13px;font-weight:560;color:var(--text);background:var(--raise);border:1px solid var(--border-strong);
    padding:8px 13px;border-radius:var(--radius-sm);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s,background .15s,transform .05s;white-space:nowrap}
  .btn:hover{border-color:var(--p1)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--p1);outline-offset:2px}
  .btn.primary{background:linear-gradient(180deg,var(--p1-ink),color-mix(in srgb,var(--p1-ink) 78%,#000));color:#fff;border-color:transparent;font-weight:640}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;border-color:var(--border)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn[disabled]{opacity:.45;cursor:not-allowed}

  .main{flex:1;display:grid;grid-template-columns:minmax(360px,440px) 1fr;gap:0;align-items:start}
  @media (max-width:940px){.main{grid-template-columns:1fr}}

  /* ---------- form pane ---------- */
  .pane-form{border-right:1px solid var(--border);min-height:calc(100vh - 55px);background:var(--surface2)}
  @media (max-width:940px){.pane-form{border-right:none;border-bottom:1px solid var(--border);min-height:0}}
  .scroll{padding:18px 18px 120px}

  .sect{margin-bottom:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .sect > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:13px 15px;font-weight:600;font-size:13.5px;user-select:none}
  .sect > summary::-webkit-details-marker{display:none}
  .sect > summary .chev{margin-left:auto;color:var(--faint);transition:transform .18s}
  .sect[open] > summary .chev{transform:rotate(90deg)}
  .sect .step{width:22px;height:22px;flex:none;border-radius:6px;background:var(--surface2);border:1px solid var(--border-strong);display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .sect .body{padding:4px 15px 16px;border-top:1px solid var(--border)}
  .summ-tag{margin-left:8px;font-size:11px;font-weight:500;color:var(--p1);background:color-mix(in srgb,var(--p1) 14%,transparent);padding:2px 7px;border-radius:20px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  label.fld{display:block;margin-top:13px}
  label.fld:first-child{margin-top:6px}
  .lab{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
  .hint{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.35}
  input[type=text],input[type=url],input[type=date],input[type=number],select,textarea{
    width:100%;font-family:inherit;font-size:13.5px;color:var(--text);background:var(--field);
    border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:9px 11px;transition:border-color .15s,background .15s}
  textarea{resize:vertical;min-height:60px;line-height:1.45}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p1);background:var(--field-focus)}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),linear-gradient(135deg,var(--faint) 50%,transparent 50%);background-position:calc(100% - 16px) 51%,calc(100% - 11px) 51%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row2 label.fld{margin-top:13px}

  /* guest cards */
  .guest{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-top:11px;position:relative}
  .guest .rm{position:absolute;top:8px;right:8px;border:none;background:transparent;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;padding:2px 5px;border-radius:5px}
  .guest .rm:hover{color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent)}
  .guest .gh{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--p2);margin-bottom:2px}

  /* tools */
  .toolcat{margin-top:14px}
  .toolcat:first-child{margin-top:6px}
  .toolcat h4{margin:0 0 8px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
  .toolcat h4::after{content:"";flex:1;height:1px;background:var(--border)}
  .tool{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:6px}
  .tool:hover{background:var(--surface2)}
  .tool .nm{font-size:13px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chk{width:17px;height:17px;flex:none;border-radius:5px;border:1.5px solid var(--border-strong);background:var(--field);cursor:pointer;display:grid;place-items:center;transition:.12s}
  .chk[data-on="1"]{background:var(--p1-ink);border-color:var(--p1-ink)}
  .chk[data-on="1"]::after{content:"";width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translateY(-1px)}
  .dd{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--border-strong);background:var(--field);border-radius:20px;padding:3px 9px;cursor:pointer;transition:.12s;white-space:nowrap}
  .dd[data-on="1"]{color:#fff;background:var(--p3-ink);border-color:var(--p3-ink)}
  .dd[disabled]{opacity:.4;cursor:not-allowed}
  .ddcount{font-size:11.5px;color:var(--muted);margin-top:10px;padding:8px 11px;background:var(--surface2);border-radius:7px;border:1px solid var(--border)}
  .ddcount b{color:var(--p3)}
  .ddcount .over{color:var(--danger)}

  .toggle{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
  .switch{width:38px;height:22px;border-radius:20px;background:var(--border-strong);position:relative;transition:.16s;flex:none}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.16s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
  .toggle[data-on="1"] .switch{background:var(--p2-ink)}
  .toggle[data-on="1"] .switch::after{left:18px}

  .icp-note{font-size:11.5px;color:var(--faint);margin:2px 0 0;display:flex;gap:6px;align-items:flex-start}
  .icp-note b{color:var(--p1)}
  .taglist{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

  /* ---------- output pane ---------- */
  .pane-out{min-height:calc(100vh - 55px);display:flex;flex-direction:column}
  .tabs{position:sticky;top:55px;z-index:10;display:flex;gap:2px;padding:10px 18px 0;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);flex-wrap:wrap}
  .tab{font-family:inherit;font-size:13px;font-weight:560;color:var(--muted);background:transparent;border:none;border-bottom:2px solid transparent;padding:9px 12px 11px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .tab:hover{color:var(--text)}
  .tab[data-on="1"]{color:var(--text);border-bottom-color:var(--accent,var(--p1))}
  .tab .dot{width:7px;height:7px;border-radius:50%;background:var(--accent,var(--p1))}
  .out-wrap{padding:18px;flex:1}
  .out-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .out-head h2{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
  .out-head .sub{font-size:12.5px;color:var(--muted)}
  .out-head .sp{margin-left:auto;display:flex;gap:8px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--raise);border:1px solid var(--p3);color:var(--text);padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.22s;z-index:60}
  .toast[data-on="1"]{opacity:1;transform:translateX(-50%) translateY(0)}

  .doc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:26px 30px;box-shadow:var(--shadow);max-width:760px}
  .doc.code{padding:0;max-width:none;overflow:hidden}
  .doc.code pre{margin:0;padding:20px 22px;overflow:auto;max-height:calc(100vh - 210px);font-family:var(--mono);font-size:12px;line-height:1.55;color:var(--text)}
  .doc.code pre::-webkit-scrollbar{height:10px;width:10px}
  .doc.code pre::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:6px}

  /* rendered markdown-ish */
  .md h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--p1);margin:26px 0 6px;font-weight:700}
  .md h3:first-child{margin-top:0}
  .md h4{font-size:14.5px;margin:20px 0 4px;font-weight:650}
  .md p{margin:0 0 11px;white-space:pre-wrap}
  .md ul{margin:0 0 12px;padding-left:20px}
  .md li{margin:0 0 5px}
  .md .rule{height:1px;background:var(--border);margin:20px 0;border:none}
  .md .muted{color:var(--muted)}
  .md .slidecard{border:1px solid var(--border);border-radius:8px;padding:13px 15px;margin:0 0 10px;background:var(--surface2)}
  .md .slidecard .sn{display:flex;align-items:center;gap:9px;margin-bottom:8px}
  .md .slidecard .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:12px;color:#fff;background:var(--faint);border-radius:5px;padding:2px 7px;min-width:26px;text-align:center}
  .md .slidecard .num.p1{background:var(--p1-ink)}
  .md .slidecard .num.p2{background:var(--p2-ink)}
  .md .slidecard .num.p3{background:var(--p3-ink)}
  .md .slidecard .num.dk{background:#0F172A;border:1px solid var(--border-strong)}
  .md .slidecard .tt{font-weight:640;font-size:13.5px}
  .md .slidecard .kind{margin-left:auto;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
  .md .slidecard .cp{font-size:13px;white-space:pre-wrap;color:var(--text)}
  .md .slidecard .cp b{color:var(--text)}
  .md .slidecard .note{font-size:12px;color:var(--muted);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
  .md .slidecard table{border-collapse:collapse;width:100%;font-size:11.5px;margin-top:6px}
  .md .slidecard th,.md .slidecard td{border:1px solid var(--border);padding:5px 7px;text-align:left;vertical-align:top}
  .md .slidecard th{background:var(--surface);font-weight:650}
  .flag{color:var(--amber);font-weight:600}

  .empty{display:grid;place-items:center;min-height:60vh;text-align:center;color:var(--muted);padding:20px}
  .empty .big{font-size:15px;color:var(--text);font-weight:600;margin-bottom:6px}

  a.lnk{color:var(--p1);text-decoration:none}
  a.lnk:hover{text-decoration:underline}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="glyph"><i></i></span>
      <h1>Workshop Builder<span>AI Fundamentals for Professionals - Atlanta</span></h1>
    </div>
    <div class="top-actions">
      <button class="btn ghost sm" id="themeBtn" title="Toggle theme">Theme</button>
      <button class="btn ghost sm" id="resetBtn" title="Clear all fields">Reset</button>
      <button class="btn primary" id="genBtn">Generate all</button>
    </div>
  </header>

  <div class="main">
    <!-- FORM -->
    <section class="pane-form">
      <div class="scroll" id="form"></div>
    </section>

    <!-- OUTPUT -->
    <section class="pane-out">
      <div class="tabs" id="tabs"></div>
      <div class="out-wrap" id="out"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast"></div>

// Return the credibility line for a slide, or null.
function credForSlide(s){
  if(!s || !s.title) return null;
  const t=String(s.title).toLowerCase();
  if(/^deep dive:/.test(t)){
    const tool=s.title.slice(s.title.indexOf(":")+1).trim();
    const meta=TOOL_KIND[tool];
    return (meta && CRED_BY_KIND[meta.kind]) || CRED_FALLBACK;
  }
  for(const r of CRED_RULES){ if(r.kw.some(k=>t.includes(k))) return r.line; }
  // topic slides carry the audience-fit line; pure title/thank-you slides get nothing
  if(s.kind==="title" || /thank you|resources|agenda|continue learning/.test(t)) return null;
  return CRED_FALLBACK;
}

function freshIcp(aud){
  const s = ICP[aud] || {titles:"",pains:[],winning:[],tools:[],claude:[],gemini:[],perplexity:[],notebooklm:[],cowork:[]};
  return JSON.parse(JSON.stringify(s));
}
function mergeIcp(a1,a2){
  const s1=freshIcp(a1);
  if(!a2) return s1;
  const s2=freshIcp(a2);
  const uniq=arr=>{ const seen={}, out=[]; arr.filter(Boolean).forEach(x=>{ const k=x.toLowerCase(); if(!seen[k]){seen[k]=1; out.push(x);} }); return out; };
  const m={};
  ["pains","winning","tools","claude","gemini","perplexity","notebooklm","cowork"].forEach(k=> m[k]=uniq((s1[k]||[]).concat(s2[k]||[])) );
  m.titles=[s1.titles,s2.titles].filter(Boolean).join(", ");
  return m;
}
// ----- persistence (saves ICP edits and custom audiences in the browser) -----
const LS_KEY="wsb_store_v1";
function loadStore(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||"{}"); }catch(e){ return {}; } }
function saveStore(o){ try{ localStorage.setItem(LS_KEY, JSON.stringify(o)); }catch(e){} }
function customAudList(){ return (loadStore().customAudiences)||[]; }
// ----- custom tools & categories (user-added; new tools ship constantly) -----
// Built-in behavior kinds -> friendly label. A tool's category maps to one of
// these kinds, which drives its talking points, stack role, and credibility.
const TOOL_KINDS = [
  ["llm","Core LLM / Chatbot"],
  ["research","Research & Discovery"],
  ["notetaker","Notetaker & Meeting AI"],
  ["docintel","Document Intelligence"],
  ["automation","Automation & Agents"],
  ["writing","Writing & Content"],
  ["image","Image, Video & Media"],
  ["voice","Voice & Audio"]
];
function kindLabelFor(kind){ const m=TOOL_KINDS.find(k=>k[0]===kind); return m?m[1]:"Core LLM / Chatbot"; }
function isBuiltinCat(key){ return TOOL_KINDS.some(k=>k[0]===key); }
// user-defined categories: {key,label,kind}. Let the facilitator group added tools their own way.
function customCatList(){ return (loadStore().customCats)||[]; }
function saveCustomCats(list){ const s=loadStore(); s.customCats=list; saveStore(s); }
function catLabel(cat){ if(isBuiltinCat(cat)) return kindLabelFor(cat); const c=customCatList().find(x=>x.key===cat); return c?c.label:cat; }
function catKind(cat){ if(isBuiltinCat(cat)) return cat; const c=customCatList().find(x=>x.key===cat); return c?c.kind:"llm"; }
function addCustomCat(label, kind){
  label=(label||"").trim(); if(!label){ toast("Name the category first"); return null; }
  const key="c_"+label.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"");
  const list=customCatList();
  if(!list.some(c=>c.key===key)){ list.push({key, label, kind:kind||"llm"}); saveCustomCats(list); }
  return key;
}
// custom tools: {name,cat}. (Older saves used {name,kind} -> read as cat.)
function customToolList(){ return (loadStore().customTools||[]).map(t=>({name:t.name, cat:t.cat||t.kind||"llm"})); }
function saveCustomTools(list){ const s=loadStore(); s.customTools=list; saveStore(s); }
// Register custom tools into TOOL_KIND so templates, stack roles, and credibility work on them.
function registerCustomTools(){ customToolList().forEach(t=>{ if(t&&t.name) TOOL_KIND[t.name]={kind:catKind(t.cat), field:null}; }); }
function toolExists(name){ const n=name.trim().toLowerCase(); return !!TOOL_KIND[Object.keys(TOOL_KIND).find(k=>k.toLowerCase()===n)] || customToolList().some(t=>t.name.toLowerCase()===n); }
function addCustomTool(name, cat){
  name=(name||"").trim();
  if(!name){ toast("Type a tool name first"); return false; }
  if(toolExists(name)){ toast('"'+name+'" is already in the list'); return false; }
  cat=cat||"llm";
  const list=customToolList(); list.push({name, cat}); saveCustomTools(list);
  TOOL_KIND[name]={kind:catKind(cat), field:null};
  state.include[name]=true;   // added tools start ON so they show up right away
  lastToolCat=cat;            // keep the category sticky for adding several in a row
  rerenderAll();
  return true;
}
function removeCustomTool(name){
  saveCustomTools(customToolList().filter(t=>t.name!==name));
  delete TOOL_KIND[name];
  delete state.include[name];
  state.deep=state.deep.filter(x=>x!==name);
  rerenderAll();
}
let lastToolCat="llm";  // remembers the last category used, so multi-add stays fast
const openSections=new Set();  // remembers which form sections are expanded across re-renders
function persistReminder(){ const s=loadStore(); s.remindWeeks=state.remindWeeks; saveStore(s); }
function persistFacilitator(){ const s=loadStore(); s.facMemd=state.facMemd; s.credNotes=state.credNotes; saveStore(s); }
function persistBrand(){ const s=loadStore(); s.deckLogo=state.deckLogo; saveStore(s); }
function primaryName(){ return state.audience==="__custom__" ? (state.customName.trim()||"Custom Audience") : state.audience; }
function persistIcp(){
  if(!state.audience || state.audience2) return;   // persist single-audience ICPs only
  const name=primaryName();
  if(!name || name==="Custom Audience") return;
  const s=loadStore(); s.overrides=s.overrides||{}; s.overrides[name]=state.icp;
  if(state.audience==="__custom__"){ s.customAudiences=s.customAudiences||[]; if(s.customAudiences.indexOf(name)<0) s.customAudiences.push(name); }
  saveStore(s);
}
function applyAud(){
  if(!state.audience2){
    const name=primaryName(), s=loadStore();
    if(s.overrides && s.overrides[name]){ state.icp=JSON.parse(JSON.stringify(s.overrides[name])); return; }
  }
  state.icp = mergeIcp(state.audience==="__custom__"?"":state.audience, state.audience2);
}
function baseName(a){ return (a||"").replace(/ (Professionals|Leaders|Managers|Administrators|Advisors|Solopreneurs|Owners)$/,""); }
function defaultLabel(){ if(!state.audience) return ""; if(state.audience2) return baseName(primaryName())+" & "+baseName(state.audience2)+" Professionals"; return primaryName(); }
function audLabel(){ return (state.label&&state.label.trim())?state.label.trim():defaultLabel(); }
function defaultNoun(){ if(state.audience2) return (baseName(primaryName())+" and "+baseName(state.audience2)+" professional").toLowerCase(); return (AUD_META[primaryName()]||{}).noun||"professional"; }
function audNoun(){ return (state.noun&&state.noun.trim())?state.noun.trim():defaultNoun(); }
function audNounPl(){ const n=audNoun(); return /s$/.test(n)?n:n.replace(/y$/,"ie")+"s"; }

/* ============================================================ HELPERS ============================================================ */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e;};
const esc = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const clean = s => (s==null?"":String(s))
  .replace(/[—–]/g,"-")
  .replace(/;/g,",")
  .replace(/[‘’]/g,"'")
  .replace(/[“”]/g,'"');
const slug = s => (s||"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"");
const cap = s => s ? s[0].toUpperCase()+s.slice(1) : s;

function fmtDate(d){
  if(!d) return "";
  const dt = new Date(d+"T12:00:00");
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString("en-US",{weekday:"long", month:"long", day:"numeric", year:"numeric"});
}
function monthYear(d){
  if(!d) return {m:"Month", y:"Year"};
  const dt = new Date(d+"T12:00:00");
  if(isNaN(dt)) return {m:"Month", y:"Year"};
  return {m:dt.toLocaleDateString("en-US",{month:"long"}), y:String(dt.getFullYear())};
}
function list(arr){ return (arr||[]).filter(Boolean); }
function firstN(arr,n){ return list(arr).slice(0,n); }
function nn(){ const g=state.guests.filter(x=>x.name.trim()); return g; }
function guestsFor(kind){ return state.guests.filter(g=>g.name.trim() && g[kind]); }
function deepTools(){ return state.deep.filter(t=>state.include[t]); }

function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.setAttribute("data-on","1");
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.removeAttribute("data-on"),1600);
}
async function copyText(txt){
  try{ await navigator.clipboard.writeText(txt); toast("Copied to clipboard"); }
  catch(e){
    const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied to clipboard"); }catch(_){ toast("Copy failed"); }
    ta.remove();
  }
}
async function saveFile(filename, data){
  if(window.claude && window.claude.downloads && typeof window.claude.downloads.save==="function"){
    try{ await window.claude.downloads.save({filename, data}); toast("Saved "+filename); return; }
    catch(e){ /* fall through to blob */ }
  }
  try{
    const blob=new Blob([data],{type:"text/plain"}); const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1500); toast("Downloaded "+filename);
  }catch(e){ toast("Download blocked"); }
}

/* ---------- reminder / calendar helpers ---------- */
// 2nd Wednesday of a given year & 0-based month
function secondWednesday(y,m){
  const first=new Date(y,m,1);
  const off=(3 - first.getDay() + 7)%7;      // days until the first Wednesday (Wed=3)
  return new Date(y,m,1+off+7);
}
// the next upcoming 2nd Wednesday from a reference date (defaults to today)
function nextSecondWednesday(ref){
  const t = ref ? new Date(ref.getFullYear(),ref.getMonth(),ref.getDate()) : (()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());})();
  let w=secondWednesday(t.getFullYear(),t.getMonth());
  if(w<t){ const nm=new Date(t.getFullYear(),t.getMonth()+1,1); w=secondWednesday(nm.getFullYear(),nm.getMonth()); }
  return w;
}
function toISODate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
// reminder date = event date minus N weeks (returns a Date, or null if no event date)
function reminderDate(eventISO,weeks){
  if(!eventISO) return null;
  const [y,mo,da]=eventISO.split("-").map(Number);
  if(!y||!mo||!da) return null;
  const d=new Date(y,mo-1,da); d.setDate(d.getDate()-(weeks||0)*7); return d;
}
function ymdCompact(d){ return d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
function icsEsc(s){ return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n"); }
// an all-day reminder VEVENT with a same-day display alarm
function buildIcs(remDate,title,desc){
  const start=ymdCompact(remDate);
  const end=ymdCompact(new Date(remDate.getFullYear(),remDate.getMonth(),remDate.getDate()+1));
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d{3}Z$/,"Z");
  const uid="wsb-"+start+"-"+Math.random().toString(36).slice(2,8)+"@ai-fundamentals-workshop";
  return [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//AIC//AI Fundamentals Workshop Builder//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    "BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+stamp,
    "DTSTART;VALUE=DATE:"+start,"DTEND;VALUE=DATE:"+end,
    "SUMMARY:"+icsEsc(title),"DESCRIPTION:"+icsEsc(desc),
    "BEGIN:VALARM","TRIGGER:PT0S","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(title),"END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
}
function gcalUrl(remDate,title,desc){
  const s=ymdCompact(remDate);
  const e=ymdCompact(new Date(remDate.getFullYear(),remDate.getMonth(),remDate.getDate()+1));
  const p=new URLSearchParams({action:"TEMPLATE",text:title,dates:s+"/"+e,details:desc});
  return "https://calendar.google.com/calendar/render?"+p.toString();
}

function genericToolUses(kind, tool, noun, nounPl){
  const T = {
    llm:["Draft "+noun+" deliverables from a short prompt in your voice","Turn messy notes into a clean first version","Ask it to pressure-test your thinking before you send"],
    research:["Run pre-work research on people, companies, and trends","Get sourced answers you can drop straight into your work","Replace an hour of tab-hopping with one good prompt"],
    notetaker:["Let it join every call so you never type a note again","Turn recordings into summaries, action items, and follow-ups","Search past meetings by topic instead of scrubbing audio"],
    docintel:["Upload long documents and ask questions in plain language","Pull the themes and key points from dense "+noun+" files","Turn source material into a briefing in minutes"],
    automation:["Hand off a repetitive "+noun+" task to a workflow that runs itself","Connect the tools you already use so output flows automatically","Build a recurring deliverable once, then let it run"],
    writing:["Draft "+noun+" content in your voice, faster","Go from outline to polished draft without the blank page","Keep tone and messaging consistent across everything you ship"],
    image:["Create on-brand visuals without a designer in the loop","Produce "+noun+" graphics and media in minutes","Test a concept visually before you commit budget"],
    voice:["Generate natural voice and audio for your content","Turn a script into finished audio without a studio","Scale spoken content on demand"]
  };
  return T[kind] || T.llm;
}
function stackRole(tool){
  const k = (TOOL_KIND[tool]||{}).kind;
  const map = {llm:"your main writing and thinking engine",research:"your research and fact-finding",notetaker:"capturing every meeting",docintel:"reading your long documents",automation:"running work on autopilot",writing:"fast content drafting",image:"visuals and media",voice:"audio and voice"};
  return map[k] || "a core part of your stack";
}

/* ---------- pptxgenjs script generator ---------- */
function pptxMeta(fname){
  const m={file:fname, audience:audLabel(), date:fmtDate(state.date), venue:state.venue};
  if(state.deckLogo==="aic"){ m.logo=AIC_LOGO; m.logoRatio=AIC_LOGO_RATIO; }
  else if(state.deckLogo==="stitchs"){ m.logo=STITCHS_LOGO; m.logoRatio=STITCHS_LOGO_RATIO; }
  return m;
}
function pptxFileName(){ const my=monthYear(state.date); return "AI_Fundamentals_"+slug(audLabel()||"Audience")+"_"+my.m+my.y+".pptx"; }
// sanitize the slide model to plain, cleaned data for pptxgenjs
function pptxSlides(model){
  return model.map(s=>({
    kind:s.kind, part:s.part, accent:s.accent||null, title:clean(s.title), subtitle:s.subtitle?clean(s.subtitle):null,
    bullets:s.bullets?s.bullets.map(clean):null,
    columns:s.columns?s.columns.map(col=>({head:clean(col.head), items:col.items.map(clean)})):null,
    table:s.table?{headers:s.table.headers.map(clean), rows:s.table.rows.map(r=>r.map(clean))}:null,
    footer:s.footer?clean(s.footer):null
  }));
}
function genPptx(model){
  const fname = pptxFileName();
  const header =
"// "+fname+"\n"+
"// AIC Atlanta brand colors; "+(state.deckLogo==="aic"?"AIC logo on slides.":state.deckLogo==="stitchs"?"Stitchs logo on slides.":"no logo.")+"\n"+
"// Generated by the AI Fundamentals Workshop Builder\n"+
"// Run:  npm i pptxgenjs   then   node build-deck.js\n"+
"// Design system: white content slides, dark section/closer slides, Calibri, thin rules, RECTANGLE only.\n\n"+
'const pptxgen = require("pptxgenjs");\n\n'+
"const META = "+JSON.stringify(pptxMeta(fname), null, 2)+";\n\n"+
"const SLIDES = "+JSON.stringify(pptxSlides(model), null, 2)+";\n\n";
  return header + PPTX_BODY;
}
// Build and download the real .pptx right in the browser, using the same design
// code as the Node script (bundled pptxgenjs). No coding required.
function downloadPptx(model){
  const Engine = window.PptxGenJS || window.pptxgen;
  if(typeof Engine!=="function"){ toast("PowerPoint engine still loading - try again in a second"); return; }
  const META = pptxMeta(pptxFileName());
  const SLIDES = pptxSlides(model);
  const body = PPTX_BODY.replace('"/mnt/user-data/outputs/" + META.file', "META.file");
  try{
    (new Function("pptxgen","META","SLIDES", body))(Engine, META, SLIDES);
    toast("Building "+META.file+" …");
  }catch(e){ toast("PowerPoint error: "+((e&&e.message)||e)); }
}

function genFacilitator(model){
  const aud = audLabel() || "your audience";
  const lead = state.lead.name || "The facilitator";

  out += lead+"\n"+FAC_HEADLINE+"\n\n";
  out += "WHY I CAN LEAD EACH TOPIC TONIGHT\n";

  const seen = {};
  model.forEach(s=>{
    const c = credForSlide(s);
    if(!c || seen[c]) return;      // one line per distinct credential
    seen[c] = 1;
    out += "- "+clean(s.title)+"\n  "+c+"\n";

function paraBlock(text){
  const wrap=el("div");
  text.split(/\n\n+/).forEach(chunk=>{
    const lines=chunk.split("\n");
    // heading if single short line with no trailing period and next lines exist, keep simple: render as <p>
    const p=el("p"); p.textContent=chunk; wrap.appendChild(p);
  });
  return wrap;
}

function renderBriefCards(container, model){
  model.forEach((s,i)=>{

    const cp=el("div","cp");
    let html="";
    if(s.subtitle) html+='<i style="color:var(--muted)">'+esc(clean(s.subtitle))+'</i>\n';
    if(s.bullets) html+=s.bullets.map(b=>"- "+flagize(esc(clean(b)))).join("\n");
    if(s.columns) html+=s.columns.map(col=>"<b>"+esc(clean(col.head))+"</b>\n"+col.items.map(it=>"  - "+esc(clean(it))).join("\n")).join("\n\n");
    cp.innerHTML=html;

      const tb=el("table");
      const tr=el("tr"); s.table.headers.forEach(h=>{const th=el("th",null,clean(h)); tr.appendChild(th);}); tb.appendChild(tr);

/* ---- form helpers ---- */
function section(num,title,summary,fill,openDefault){
  const d=el("details","sect"); if(openDefault || openSections.has(title)) d.open=true;
  d.addEventListener("toggle",()=>{ if(d.open) openSections.add(title); else openSections.delete(title); });
  const s=el("summary");
  s.appendChild(el("span","step",num));
  s.appendChild(el("span",null,title));
  const tag=el("span","summ-tag",summary); tag.dataset.sumfor=title; s.appendChild(tag);
  const chev=el("span","chev",">"); s.appendChild(chev);
  d.appendChild(s);
  const body=el("div","body"); fill(body); d.appendChild(body);
  return d;
}
function fld(label, control, hint){
  const l=el("label","fld"); l.appendChild(el("span","lab",label)); l.appendChild(control);
  if(hint){ l.appendChild(el("div","hint",hint)); }
  return l;
}
function inp(val, on, ph){ const e=el("input"); e.type="text"; e.value=val||""; if(ph)e.placeholder=ph; e.oninput=()=>on(e.value); return e; }
function reqInp(val, on, ph){ const e=inp(val,on,ph); const mark=()=>{ e.style.borderColor = e.value.trim() ? "" : "var(--danger)"; }; mark(); e.addEventListener("input",mark); return e; }
function ta(val, on){ const e=el("textarea"); e.value=val||""; e.oninput=()=>on(e.value); return e; }
function opt(v,t){ const o=el("option",null,t); o.value=v; return o; }
function splitLines(v){ return v.split("\n").map(x=>x.trim()).filter(Boolean); }
function splitAny(v){ return v.split(/[\n,]/).map(x=>x.trim()).filter(Boolean); }

function updateSummaries(){
  // cheap: rebuild form summaries by re-render (form only)
}

$("#genBtn").onclick=()=>{
  if(!state.audience){ toast("Pick an audience first"); return; }
  renderTabs(); renderOutput(); toast("All deliverables generated");
};
$("#resetBtn").onclick=()=>{
  if(!confirm("Clear all fields and start over?")) return;
  state.audience=""; state.audience2=""; state.label=""; state.noun=""; state.customName=""; state.icp=null; state.date=""; state.venue=VENUE_DEFAULT; state.seats=SEATS_DEFAULT;
  state.guests=[]; state.include={}; state.deep=[]; state.angle="";
  state.maven={on:false,title:"",start:"",price:"",url:""}; state.activeTab="luma";
  rerenderAll();
};
$("#themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="light" ? "dark" : (cur==="dark" ? "light" : (matchMedia("(prefers-color-scheme: dark)").matches?"light":"dark"));
  document.documentElement.setAttribute("data-theme", next);
};

// initial
(function(){
  const s=loadStore();
  if(typeof s.remindWeeks==="number") state.remindWeeks=Math.min(12,Math.max(0,s.remindWeeks));
  if(typeof s.facMemd==="string" && s.facMemd.trim()) state.facMemd=s.facMemd;
  if(typeof s.credNotes==="boolean") state.credNotes=s.credNotes;
  if(s.deckLogo==="aic"||s.deckLogo==="stitchs"||s.deckLogo==="none") state.deckLogo=s.deckLogo;
  else if(typeof s.brandLogo==="boolean") state.deckLogo = s.brandLogo ? "aic" : "none";  // migrate older setting
  registerCustomTools();
})();
rerenderAll();
</script>

</body></html>
