<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>AIC Sponsorship Studio</title>
<style>
:root{
  --bg:#F7F5F1; --panel:#FFFFFF; --ink:#22283A; --mut:#6E7484; --line:#E5E1D8;
  --brand:#E05A14; --brand-ink:#B4470D; --brand-soft:#FBEADF;
  --indigo:#232B8C; --indigo-soft:#E8EAF7;
  --ok:#187A4B; --ok-soft:#E3F3EA;
  --gold:#8F6E00; --gold-soft:#F9F1DA;
  --silver:#5B6E86; --silver-soft:#EDF1F6;
  --bronze:#8A5A33; --bronze-soft:#F4EBE2;
  --warn:#8A6D00; --warn-soft:#FBF3D4;
  --sheet:#FFFFFF; --sheet-ink:#22283A; --sheet-mut:#6E7484; --sheet-line:#E5E1D8;
  --shadow:0 1px 2px rgba(34,40,58,.06),0 8px 24px rgba(34,40,58,.07);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14161D; --panel:#1D2029; --ink:#ECEDF2; --mut:#9AA0AD; --line:#2E323E;
    --brand:#F0742F; --brand-ink:#F58B52; --brand-soft:#392315;
    --indigo:#98A2E8; --indigo-soft:#23273E;
    --ok:#4CBB84; --ok-soft:#16301F;
    --gold:#D4B44A; --gold-soft:#2E2812; --silver:#9DB0C6; --silver-soft:#232A33;
    --bronze:#C78F5C; --bronze-soft:#2E2115; --warn:#D9B83B; --warn-soft:#2E2810;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); }
}
:root[data-theme="light"]{ --bg:#F7F5F1; --panel:#FFFFFF; --ink:#22283A; --mut:#6E7484; --line:#E5E1D8;
  --brand:#E05A14; --brand-ink:#B4470D; --brand-soft:#FBEADF; --indigo:#232B8C; --indigo-soft:#E8EAF7;
  --ok:#187A4B; --ok-soft:#E3F3EA; --gold:#8F6E00; --gold-soft:#F9F1DA; --silver:#5B6E86; --silver-soft:#EDF1F6;
  --bronze:#8A5A33; --bronze-soft:#F4EBE2; --warn:#8A6D00; --warn-soft:#FBF3D4;
  --shadow:0 1px 2px rgba(34,40,58,.06),0 8px 24px rgba(34,40,58,.07); }
:root[data-theme="dark"]{ --bg:#14161D; --panel:#1D2029; --ink:#ECEDF2; --mut:#9AA0AD; --line:#2E323E;
  --brand:#F0742F; --brand-ink:#F58B52; --brand-soft:#392315; --indigo:#98A2E8; --indigo-soft:#23273E;
  --ok:#4CBB84; --ok-soft:#16301F; --gold:#D4B44A; --gold-soft:#2E2812; --silver:#9DB0C6; --silver-soft:#232A33;
  --bronze:#C78F5C; --bronze-soft:#2E2115; --warn:#D9B83B; --warn-soft:#2E2810;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); }

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"Seravek","Gill Sans Nova",Ubuntu,Calibri,"Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);
  border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:5px}
.num{font-variant-numeric:tabular-nums}

/* ── app chrome ── */
.appbar{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.appbar-in{max-width:1020px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:10px 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;margin-right:10px}
.logo .nm{font-weight:800;font-size:14px;letter-spacing:-.01em}
.logo .sb{font-size:10px;color:var(--mut);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs button{border:none;background:transparent;color:var(--mut);font-size:12.5px;font-weight:600;
  padding:7px 12px;border-radius:8px;transition:.13s}
.tabs button:hover{background:var(--brand-soft);color:var(--brand-ink)}
.tabs button.active{background:var(--brand);color:#fff}
.tabs button:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.spacer{flex:1}
main{max-width:1020px;margin:0 auto;padding:22px 16px 80px}
.sec{display:none}
.sec.active{display:block}
body.client-mode .appbar{display:none}
body.client-mode main{padding-top:14px}
.exit-pill{display:none;position:fixed;top:14px;left:14px;z-index:30;background:var(--ink);color:var(--bg);
  border:none;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:700;box-shadow:var(--shadow)}
body.client-mode .exit-pill{display:block}

/* ── panels / forms ── */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.panel h2{font-size:15px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.fg{display:flex;flex-direction:column}
.full{grid-column:1/-1}
@media(max-width:640px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:none;background:transparent;color:var(--mut);font-weight:600;font-size:12.5px;padding:8px}
.seg button.active{background:var(--brand);color:#fff}

.btn{display:inline-flex;align-items:center;gap:7px;border:none;border-radius:9px;padding:9px 16px;
  font-size:12.5px;font-weight:700;transition:.13s}
.btn-pri{background:var(--brand);color:#fff}
.btn-pri:hover{background:var(--brand-ink)}
.btn-sec{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-sec:hover{border-color:var(--brand);color:var(--brand-ink)}
.btn-ghost{background:transparent;color:var(--mut);border:none;padding:6px 8px;font-weight:600}
.btn-ghost:hover{color:var(--brand-ink)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--mut);border-radius:99px;
  padding:5px 12px;font-size:11.5px;font-weight:600}
.chip.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

.badge{display:inline-block;border-radius:99px;padding:3px 10px;font-size:10.5px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ibox{border-radius:10px;padding:11px 14px;font-size:12.5px;margin:10px 0}
.ibox.brand{background:var(--brand-soft);color:var(--brand-ink)}
.ibox.ok{background:var(--ok-soft);color:var(--ok)}
.ibox.warn{background:var(--warn-soft);color:var(--warn)}

/* tier cards */
.tcard{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.thdr{padding:11px 15px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tnm{font-size:13.5px;font-weight:800}
.tmt{font-size:11px;opacity:.75;margin-top:1px}
.tpr{font-size:18px;font-weight:800;text-align:right}
.tpr .was{display:block;font-size:10.5px;font-weight:600;opacity:.65;text-decoration:none}
.tbdy{padding:10px 15px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;justify-content:space-between}
.pills{display:flex;flex-wrap:wrap;gap:5px}
.pill{font-size:10.5px;padding:3px 10px;border-radius:99px;font-weight:600}
.t-pl .thdr{background:var(--indigo);color:#fff}.t-pl .tpr,.t-pl .tnm{color:#fff}
.t-pl{border-color:var(--indigo)} .t-pl .pill{background:var(--indigo-soft);color:var(--indigo)}
.t-go{border-color:var(--gold)} .t-go .thdr{background:var(--gold-soft);color:var(--gold)}
.t-go .pill{background:var(--gold-soft);color:var(--gold)}
.t-si{border-color:var(--silver)} .t-si .thdr{background:var(--silver-soft);color:var(--silver)}
.t-si .pill{background:var(--silver-soft);color:var(--silver)}
.t-br{border-color:var(--bronze)} .t-br .thdr{background:var(--bronze-soft);color:var(--bronze)}
.t-br .pill{background:var(--bronze-soft);color:var(--bronze)}

/* tables */
table{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  color:var(--mut);padding:8px 8px;border-bottom:2px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl .r{text-align:right}
.tblwrap{overflow-x:auto}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:20px;font-weight:800;letter-spacing:-.02em}
.stat .l{font-size:11px;color:var(--mut);margin-top:2px}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
@media(max-width:640px){.statrow{grid-template-columns:1fr}}

/* proposal line items */
.li{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.li-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.li-name{font-weight:700;font-size:13px}
.li-grid{display:grid;grid-template-columns:90px 110px 130px 1fr auto;gap:10px;align-items:end}
@media(max-width:760px){.li-grid{grid-template-columns:1fr 1fr}}
.li-net{font-size:15px;font-weight:800;white-space:nowrap}
.strike{text-decoration:line-through;opacity:.55;font-weight:600;font-size:12px}

/* ── documents (sheets) ── */
.sheet{background:var(--sheet);color:var(--sheet-ink);border:1px solid var(--line);border-radius:16px;
  box-shadow:var(--shadow);max-width:820px;margin:0 auto;overflow:hidden}
.sheet a{color:#B4470D}
.sh-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:30px 36px 0}
.sh-brand{display:flex;align-items:center;gap:10px}
.sh-brand .t1{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#22283A}
.sh-brand .t2{font-size:10px;color:#6E7484;letter-spacing:.05em}
.sh-chapter{text-align:right;max-width:55%}
.sh-chapter .cn{font-size:clamp(22px,4.5vw,34px);font-weight:800;letter-spacing:-.025em;line-height:1.05;
  color:#E05A14;text-wrap:balance}
.sh-chapter .cs{font-size:11px;color:#6E7484;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.sh-body{padding:22px 36px 36px}
.sh-rule{height:3px;background:linear-gradient(90deg,#E05A14,#232B8C);border:none;margin:18px 36px 0;border-radius:2px}
.sheet h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:18px 0 6px;text-wrap:balance;color:#22283A}
.sheet h3{font-size:13px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#E05A14;margin:26px 0 10px}
.sheet p{color:#454B5E;line-height:1.65;font-size:13px}
.sheet .tbl th{color:#6E7484;border-bottom-color:#E5E1D8}
.sheet .tbl td{border-bottom-color:#EEEBE4;color:#22283A}
.sheet .mut{color:#6E7484}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:12.5px;margin:10px 0 4px}
.doc-meta .k{color:#6E7484}
.doc-total td{border-top:2px solid #22283A;border-bottom:none!important;font-weight:800;font-size:14px}
.sig-row{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:44px}
.sig .ln{border-bottom:1.5px solid #22283A;height:34px}
.sig .lb{font-size:10.5px;color:#6E7484;letter-spacing:.07em;text-transform:uppercase;margin-top:6px}
@media(max-width:640px){.sh-head{flex-direction:column}.sh-chapter{text-align:left;max-width:100%}
  .sh-body{padding:18px 20px 26px}.sh-head{padding:22px 20px 0}.sh-rule{margin:14px 20px 0}.sig-row{grid-template-columns:1fr}}

/* brochure specifics */
.bro-banner{display:block;width:100%;height:auto;margin-top:20px}
.bro-collage{display:block;width:100%;height:auto;border-radius:12px;margin-top:4px}
.bro-gallery{display:grid;gap:8px;margin-top:4px}
.bro-gallery.g1{grid-template-columns:1fr}
.bro-gallery.g2{grid-template-columns:repeat(2,1fr)}
.bro-gallery.g3{grid-template-columns:repeat(3,1fr)}
.bro-gallery .bro-photo{width:100%;height:100%;object-fit:cover;border-radius:12px;display:block;aspect-ratio:4/3}
.bro-gallery.g1 .bro-photo{aspect-ratio:16/7}
.figcap{font-size:10.5px;color:#6E7484;letter-spacing:.05em;text-transform:uppercase;margin-top:7px;text-align:center}
.bro-hero{background:#232B8C;color:#fff;padding:26px 36px;margin-top:22px;position:relative}
.hero-logo{position:absolute;top:22px;right:26px;max-height:58px;max-width:180px;object-fit:contain}
@media(max-width:640px){.hero-logo{position:static;display:block;margin-bottom:12px}}
.bro-hero h2{font-size:clamp(19px,3.4vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.2;max-width:480px;text-wrap:balance}
.bro-hero p{color:rgba(255,255,255,.82);font-size:12.5px;max-width:460px;margin-top:8px;line-height:1.6}
.bro-stats{display:flex;gap:28px;margin-top:18px;flex-wrap:wrap}
.bro-stats .hn{font-size:22px;font-weight:800;color:#F0894C}
.bro-stats .hl{font-size:10.5px;opacity:.75;margin-top:1px;letter-spacing:.04em;text-transform:uppercase}
.why{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:680px){.why{grid-template-columns:1fr}}
.wc{background:#F4F2ED;border-radius:10px;padding:13px}
.wc h4{font-size:12px;font-weight:800;color:#22283A;margin-bottom:4px}
.wc p{font-size:11.5px;color:#5A6070;line-height:1.55}
.recog{background:#FBEADF;border-radius:12px;padding:16px 18px}
.recog p{color:#8A4213}
.recog ul{margin:8px 0 0 18px;color:#8A4213;font-size:12.5px;line-height:1.8}
.bro-cta{background:#E05A14;border-radius:14px;padding:24px;text-align:center;margin-top:28px}
.bro-cta h3{color:#fff;margin:0 0 6px;font-size:16px;letter-spacing:.02em}
.bro-cta p{color:rgba(255,255,255,.88);margin-bottom:14px}
.bro-cta a{display:inline-block;background:#fff;color:#B4470D;border-radius:99px;padding:10px 26px;
  font-weight:800;font-size:13px;text-decoration:none}
.bro-cta a.cta-alt{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.55)}
.bro-cta a.cta-learn{background:transparent;color:#fff;border:none;text-decoration:underline;
  font-weight:600;font-size:12px;padding:6px 10px;flex-basis:100%}
.bro-cta .cta-contact{color:#fff;font-size:12px;font-weight:700;margin-top:12px}
.bro-cta .cta-ref{color:rgba(255,255,255,.82);font-size:11px;margin-top:4px}
.bro-cta .cta-actions{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.bro-cta button.print-cta{display:inline-flex;align-items:center;gap:8px;background:transparent;color:#fff;
  border:1.5px solid rgba(255,255,255,.55);border-radius:99px;padding:10px 24px;font-weight:800;font-size:13px}
.bro-cta button.print-cta:hover{background:rgba(255,255,255,.14);border-color:#fff}
.bro-cta button.print-cta:focus-visible{outline:2px solid #fff;outline-offset:2px}

.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.settings-tbl input{padding:6px 8px;border-radius:7px;font-size:12.5px}
.settings-tbl td{min-width:80px}
details{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;background:var(--panel)}
summary{cursor:pointer;font-weight:800;font-size:13.5px;padding:14px 16px;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::after{content:"+";font-size:16px;color:var(--mut)}
details[open] summary::after{content:"–"}
details .inner{padding:0 16px 16px}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media print{
  body{background:#fff}
  .appbar,.exit-pill,.no-print{display:none!important}
  main{padding:0;max-width:none}
  .sheet{border:none;box-shadow:none;border-radius:0;max-width:none}
  .panel{display:none}
  .sec.active .sheet{display:block}
}
</style>

<button class="exit-pill no-print" onclick="exitClient()">← Back to app</button>

<div class="appbar"><div class="appbar-in">
  <div class="logo">
    <span id="brandmark" style="display:flex"></span>
    <div><div class="nm">The AI Collective</div><div class="sb">Sponsorship Studio</div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <select id="langSel" style="width:auto;padding:6px 8px;font-size:12px" aria-label="Language"></select>
</div></div>

<main>
  <div id="sec-calc" class="sec"></div>
  <div id="sec-proposal" class="sec"></div>
  <div id="sec-docs" class="sec"></div>
  <div id="sec-annual" class="sec"></div>
  <div id="sec-events" class="sec"></div>
  <div id="sec-comm" class="sec"></div>
  <div id="sec-brochure" class="sec"></div>
  <div id="sec-settings" class="sec"></div>
</main>

function loadCfg(){
  try{const raw=localStorage.getItem(CFG_KEY);
    if(raw){const c=JSON.parse(raw);
      const merged={org:{...DEFAULTS.org,...c.org},chapter:{...DEFAULTS.chapter,...c.chapter},
        story:{...DEFAULTS.story,...c.story},sales:{...DEFAULTS.sales,...c.sales},
        banking:{...DEFAULTS.banking,...c.banking},news:{...DEFAULTS.news,...c.news},
        comm:{...DEFAULTS.comm,...c.comm},multsC:c.multsC||DEFAULTS.multsC,multsR:c.multsR||DEFAULTS.multsR,
        annual:c.annual||JSON.parse(JSON.stringify(DEFAULTS.annual)),
        events:c.events||JSON.parse(JSON.stringify(DEFAULTS.events))};
      // Migrate the old single chapter photo into the up-to-3 photo array.
      if(!Array.isArray(merged.chapter.photos3))merged.chapter.photos3=[];
      if(merged.chapter.photos && !merged.chapter.photos3.length){merged.chapter.photos3=[merged.chapter.photos];}
      merged.chapter.photos='';
      return merged;}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(cfg))}catch(e){}reportSetupOnce();}

/* ═══════════════ REPORTING (optional; no-op until REPORT_ENDPOINT is set) ═══════════════ */
function report(event,extra){
  if(!REPORT_ENDPOINT)return;
  try{
    const c=cfg.chapter;
    const payload=Object.assign({
      event:event, chapter:c.name||'', region:c.regionName||'', lang:c.lang||'en',
      referredByName:c.refByName||'', referredByEmail:c.refByEmail||''
    }, extra||{});
    fetch(REPORT_ENDPOINT,{method:'POST',mode:'no-cors',keepalive:true,
      headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  }catch(e){}
}
function reportSetupOnce(){
  if(!REPORT_ENDPOINT)return;
  try{ if(cfg.chapter.name && !localStorage.getItem('aic-reported-setup')){
    localStorage.setItem('aic-reported-setup','1'); report('setup'); } }catch(e){}
}
function reportUsageOnce(){
  if(!REPORT_ENDPOINT)return;
  try{ if(cfg.chapter.name && !sessionStorage.getItem('aic-reported-usage')){
    sessionStorage.setItem('aic-reported-usage','1'); report('usage'); } }catch(e){}
}

function t(k){const d=T[cfg.chapter.lang]||T.en;let v=d[k];if(v===undefined)v=T.en[k];return v;}
function tf(k,vars){let s=t(k);for(const key in vars)s=s.replace('{'+key+'}',vars[key]);return s;}

/* ═══════════════ MONEY ═══════════════ */
function fmt(usd){
  const c=cfg.chapter;
  try{return new Intl.NumberFormat(LOCALES[c.lang]||'en-US',
    {style:'currency',currency:c.currency,maximumFractionDigits:0}).format(Math.round(usd*(c.fx||1)));}
  catch(e){return '$'+Math.round(usd).toLocaleString();}
}
function activeMembers(){
  return cfg.chapter.scope==='chapter'?(cfg.chapter.members||0):(cfg.chapter.regionMembers||0);
}
function mult(){
  const m=activeMembers();
  if(!m)return 1;
  const table=cfg.chapter.scope==='chapter'?cfg.multsC:cfg.multsR;
  for(const [cap,x] of table){if(cap===null||cap===''||m<Number(cap))return Number(x);}
  return 1;
}
function tierPrice(i){
  const o=(cfg.chapter.tierOver||{})[i];
  if(o!==undefined&&o!==null&&o!=='')return Number(o);
  const tr=cfg.annual[i];
  return Math.max(Math.round(tr.price*mult()), Number(tr.floor)||0);
}
function eventPrice(i){
  const e=cfg.events[i];
  return e.fixed?Math.round(e.price):Math.round(e.price*mult());
}
function newsSendPrice(){const m=activeMembers();return Math.max(Math.round(m*cfg.news.sendCPM/1000),cfg.news.sendMin);}
function newsFeatPrice(){const m=activeMembers();return Math.max(Math.round(m*cfg.news.featCPM/1000),cfg.news.featMin);}
function tierIsOver(i){const o=(cfg.chapter.tierOver||{})[i];return o!==undefined&&o!==null&&o!=='';}
function setTierOver(i,v){
  if(!cfg.chapter.tierOver)cfg.chapter.tierOver={};
  if(v===''||v===null)delete cfg.chapter.tierOver[i];else cfg.chapter.tierOver[i]=Number(v);
  saveCfg();
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ═══════════════ TABS / NAV ═══════════════ */
const TABS=[['calc','nav_calc'],['proposal','nav_prop'],['docs','nav_docs'],['annual','nav_ann'],
  ['events','nav_evt'],['comm','nav_com'],['brochure','nav_bro'],['settings','nav_set']];
let activeTab='calc';
function renderTabs(){
  document.getElementById('tabs').innerHTML=TABS.map(([id,k])=>
    `<button class="${activeTab===id?'active':''}" onclick="go('${id}')">${t(k)}</button>`).join('');
}
function go(id){
  activeTab=id;
  document.querySelectorAll('.sec').forEach(s=>s.classList.remove('active'));
  document.getElementById('sec-'+id).classList.add('active');
  document.body.classList.toggle('client-mode',id==='brochure');
  renderTabs();renderActive();
  window.scrollTo({top:0});
}
function exitClient(){go('calc');}
function renderActive(){
  ({calc:renderCalc,proposal:renderProposal,docs:renderDocs,annual:renderAnnual,
    events:renderEvents,comm:renderComm,brochure:renderBrochure,settings:renderSettings})[activeTab]();
}
function applyDir(){
  const rtl=RTL.includes(cfg.chapter.lang);
  const de=document.documentElement;
  de.setAttribute('dir',rtl?'rtl':'ltr');
  de.setAttribute('lang',cfg.chapter.lang);
}
function rerenderAll(){applyDir();renderTabs();renderActive();}

/* ═══════════════ CALCULATOR ═══════════════ */
let calcType='annual', calcEvt=0;
function renderCalc(){
  const c=cfg.chapter,m=mult();
  const el=document.getElementById('sec-calc');
  const annTotal=cfg.annual.reduce((s,tr,i)=>s+tierPrice(i)*tr.qty,0);
  let out='';
  if(calcType==='annual'){
    out=`<div class="toolrow"><span class="eyebrow" style="margin:0">${esc(c.name)} — ${t('annual')}</span>
      <span class="spacer"></span><span class="badge ok num">${fmt(annTotal)} ${t('potential')}</span></div>
      ${m!==1?`<div class="ibox brand">${tf('mult_note',{m:m,n:activeMembers().toLocaleString()})}</div>`:''}
      ${cfg.annual.map((tr,i)=>tierCard(tr,i,`<button class="btn btn-sec" onclick="addTier(${i})">＋ ${t('add_prop')}</button>`)).join('')}`;
  }else{
    const ev=cfg.events[calcEvt]||cfg.events[0];
    const adj=eventPrice(calcEvt);
    out=`<div class="chipbar" style="margin-bottom:14px">${cfg.events.map((e,i)=>
        `<button class="chip ${i===calcEvt?'on':''}" onclick="calcEvt=${i};renderCalc()">${esc(e.name)}</button>`).join('')}</div>
      ${(m!==1&&!ev.fixed)?`<div class="ibox brand">${tf('mult_note',{m:m,n:activeMembers().toLocaleString()})}</div>`:''}
      <div class="statrow">
        <div class="stat"><div class="v num">${fmt(adj)}</div><div class="l">${t('price')}${(m!==1&&!ev.fixed)?` · ${t('base')} ${fmt(ev.price)}`:''}</div></div>
        <div class="stat"><div class="v num">${ev.qty}</div><div class="l">${t('spots')} ${t('per_year')}</div></div>
        <div class="stat"><div class="v num">~${ev.att}</div><div class="l">${t('attendees')}</div></div>
      </div>
      <p style="color:var(--mut);font-size:12.5px;margin-bottom:12px">${esc(ev.detail)}</p>
      <div class="tblwrap"><table class="tbl"><thead><tr><th>${t('annual')}</th><th class="r">${t('discount')}</th><th class="r">${t('price')}</th></tr></thead>
      <tbody>${cfg.annual.filter(tr=>tr.disc>0).map(tr=>`<tr><td>${esc(tr.name)}</td><td class="r num">${tr.disc}%</td>
        <td class="r num">${fmt(adj*(1-tr.disc/100))}</td></tr>`).join('')}</tbody></table></div>
      <div style="margin-top:14px"><button class="btn btn-pri" onclick="addEvt(${calcEvt})">＋ ${t('add_prop')}</button></div>`;
  }
  el.innerHTML=`<div class="panel">
    <div class="grid3">
      <div class="fg"><label>${t('chapter')} / ${t('region')}</label>
        <div class="seg"><button class="${c.scope==='chapter'?'active':''}" onclick="cfg.chapter.scope='chapter';saveCfg();renderCalc()">${t('chapter')}</button>
        <button class="${c.scope==='region'?'active':''}" onclick="cfg.chapter.scope='region';saveCfg();renderCalc()">${t('region')}</button></div></div>
      ${c.scope==='chapter'?`
      <div class="fg"><label>${t('chapter')}</label><input value="${esc(c.name)}" placeholder="e.g. AIC Atlanta" onchange="cfg.chapter.name=this.value;saveCfg();"></div>
      <div class="fg"><label>${t('members')}</label><input type="number" min="0" value="${c.members||''}" placeholder="e.g. 4000" onchange="cfg.chapter.members=parseInt(this.value)||0;saveCfg();renderCalc()"></div>`
      :`
      <div class="fg"><label>${t('region')}</label><input value="${esc(c.regionName)}" placeholder="e.g. AIC South Central" onchange="cfg.chapter.regionName=this.value;saveCfg();"></div>
      <div class="fg"><label>${t('members')} (${t('region')})</label><input type="number" min="0" value="${c.regionMembers||''}" placeholder="e.g. 4265" onchange="cfg.chapter.regionMembers=parseInt(this.value)||0;saveCfg();renderCalc()"></div>`}
    </div>
    <div style="margin-top:12px" class="fg"><label>${t('annual')} / ${t('event')}</label>
      <div class="seg" style="max-width:280px"><button class="${calcType==='annual'?'active':''}" onclick="calcType='annual';renderCalc()">${t('annual')}</button>
      <button class="${calcType==='event'?'active':''}" onclick="calcType='event';renderCalc()">${t('event')}</button></div></div>
  </div>
  <div class="panel">${out}</div>`;
}
function tierCard(tr,i,action){
  const adj=tierPrice(i);
  const showBase=!tierIsOver(i)&&mult()!==1;
  return `<div class="tcard t-${tr.cls}">
    <div class="thdr"><div><div class="tnm">${esc(tr.name)}</div>
      <div class="tmt">${tr.qty} ${t('spots')}${tr.disc?` · ${tr.disc}% ${t('evt_disc')}`:''}</div></div>
      <div class="tpr num">${fmt(adj)}${showBase?`<span class="was">${t('base')} ${fmt(tr.price)}</span>`:''}</div></div>
    <div class="tbdy"><div class="pills">${tr.benefits.map(b=>`<span class="pill">${esc(b)}</span>`).join('')}</div>
    ${action||''}</div></div>`;
}

function ensureProp(){

/* ═══════════════ CLIENTS (lightweight CRM) ═══════════════
   Saved locally on this device (per browser). Each client keeps its contact,
   type, fulfillment status, and a re-openable snapshot of its documents
   (proposal + agreement/invoice/letter). Export CSV/JSON for the future
   platform. This is additive — nothing else depends on it. */
const CLIENTS_KEY='aic-clients-v1';
function loadClients(){try{const r=localStorage.getItem(CLIENTS_KEY);if(r){const o=JSON.parse(r);if(o&&Array.isArray(o.list))return o;}}catch(e){}return {version:1,list:[]};}
let clients=loadClients();
let curClient=null;
function saveClients(){try{localStorage.setItem(CLIENTS_KEY,JSON.stringify(clients));}catch(e){}}
function currentClient(){return clients.list.find(c=>c.id===curClient)||null;}
function clientLabel(cl){const nm=[cl.contact.first,cl.contact.last].filter(Boolean).join(' ');return [cl.contact.company,nm].filter(Boolean).join(' — ')||'(unnamed client)';}
function newClientRecord(){return {
  id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
  chapter:cfg.chapter.name||'', created:today(), updated:today(), type:'sponsor',
  contact:{first:'',last:'',company:'',title:'',email:'',phone:'',phone2:'',website:''},
  fulfillment:{logo:'',logoVer:'',bannerStatus:'',notes:''},
  snapshot:null };}
function newClient(){const cl=newClientRecord();clients.list.push(cl);curClient=cl.id;saveClients();renderDocs();}
function openClient(id){
  if(!id){curClient=null;renderDocs();return;}
  const cl=clients.list.find(c=>c.id===id); if(!cl)return;
  curClient=id;
  if(cl.snapshot){
    if(cl.snapshot.prop)prop=JSON.parse(JSON.stringify(cl.snapshot.prop));
    if(cl.snapshot.agr)agr=JSON.parse(JSON.stringify(cl.snapshot.agr));
  }
  ensureProp();
  if(!cl.snapshot){ // first open: seed the documents from the contact card
    if(cl.contact.company){prop.sponsor=cl.contact.company;agr.sponsor=cl.contact.company;}
    if(cl.contact.email)prop.email=cl.contact.email;
    const nm=[cl.contact.first,cl.contact.last].filter(Boolean).join(' ');
    if(nm)prop.contact=nm;
  }
  docState='menu';renderDocs();
}
function updClient(path,val){const cl=currentClient();if(!cl)return;const seg=path.split('.');let o=cl;for(let i=0;i<seg.length-1;i++)o=o[seg[i]];o[seg[seg.length-1]]=val;cl.updated=today();saveClients();}
function setClientType(tp){const cl=currentClient();if(!cl)return;cl.type=tp;cl.updated=today();saveClients();renderDocs();}
function deleteClient(id){const cl=clients.list.find(c=>c.id===id);if(!cl)return;if(!confirm('Delete '+clientLabel(cl)+'?\nThis removes their contact and saved documents from this device.'))return;clients.list=clients.list.filter(c=>c.id!==id);if(curClient===id)curClient=null;saveClients();toast('Client deleted');renderDocs();}
function saveClientWork(){
  let cl=currentClient();
  if(!cl){cl=newClientRecord();clients.list.push(cl);curClient=cl.id;}
  if(!cl.contact.company){cl.contact.company=(agr.sponsor||prop.sponsor||'').trim();}
  cl.snapshot={prop:JSON.parse(JSON.stringify(prop)), agr:JSON.parse(JSON.stringify(agr))};
  cl.chapter=cfg.chapter.name||cl.chapter||'';
  cl.updated=today();
  saveClients();toast('Saved to '+clientLabel(cl));renderDocs();
}
function downloadText(name,text,mime){try{const b=new Blob([text],{type:mime||'text/plain'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);}catch(e){alert('Download failed: '+e);}}
function exportClientsJSON(){if(!clients.list.length){alert('No clients saved yet.');return;}downloadText('aic-clients-'+today()+'.json',JSON.stringify(clients,null,2),'application/json');}
function csvCell(v){return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}
function exportClientsCSV(){
  if(!clients.list.length){alert('No clients saved yet.');return;}
  const cols=['Chapter','Type','Company','First','Last','Title','Email','Phone','Phone alt','Website','Logo link','Logo version','Banner status','Fulfillment notes','Proposal #','Amount','Updated'];
  const rows=[cols.map(csvCell).join(',')];
  clients.list.forEach(cl=>{const c=cl.contact,f=cl.fulfillment,s=cl.snapshot||{};const p=s.prop||{},a=s.agr||{};
    rows.push([cl.chapter,cl.type,c.company,c.first,c.last,c.title,c.email,c.phone,c.phone2,c.website,f.logo,f.logoVer,f.bannerStatus,f.notes,p.number||'',a.amount||'',cl.updated].map(csvCell).join(','));});
  downloadText('aic-clients-'+today()+'.csv',rows.join('\r\n'),'text/csv');
}

/* ═══════════════ BROCHURE PDF DOWNLOAD (8.5×11 / US Letter) ═══════════════ */
/* One-click download of the brochure as a US-Letter PDF. Uses the bundled
   html2canvas + jsPDF (inlined near the top of this file) so it works fully
   offline — no print dialog, no network. */
async function downloadBrochurePDF(btn){
  const sheet=document.querySelector('#sec-brochure .sheet');
  if(!sheet){return;}
  if(typeof window.html2canvas!=='function'||!(window.jspdf&&window.jspdf.jsPDF)){
    alert('PDF engine not loaded. Please reload the page and try again.');
    return;
  }
  const label=btn?btn.textContent:'';
  if(btn){btn.disabled=true;btn.textContent=t('dl_wait');}
  try{
    const scale=Math.min(2,(window.devicePixelRatio||1)*1.5);
    const canvas=await window.html2canvas(sheet,{
      scale:scale,
      backgroundColor:'#ffffff',
      useCORS:true,
      logging:false,
      windowWidth:sheet.scrollWidth,
      onclone:(doc)=>{
        // Drop screen-only controls (e.g. the in-sheet Download button) from the PDF.
        doc.querySelectorAll('#sec-brochure .no-print').forEach(el=>el.remove());
      }
    });
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'pt',format:'letter',orientation:'portrait',compress:true});
    const pageW=pdf.internal.pageSize.getWidth();   // 612pt  (8.5in)
    const pageH=pdf.internal.pageSize.getHeight();  // 792pt  (11in)
    const imgW=pageW;
    const imgH=canvas.height*(imgW/canvas.width);
    const imgData=canvas.toDataURL('image/jpeg',0.85);
    let heightLeft=imgH, position=0;
    pdf.addImage(imgData,'JPEG',0,position,imgW,imgH,undefined,'FAST');
    heightLeft-=pageH;
    while(heightLeft>0){
      position-=pageH;
      pdf.addPage();
      pdf.addImage(imgData,'JPEG',0,position,imgW,imgH,undefined,'FAST');
      heightLeft-=pageH;
    }
    const base=(cfg.chapter.name||'aic').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'aic';
    pdf.save(base+'-sponsorship-brochure.pdf');
  }catch(e){
    console.error('Brochure PDF failed',e);
    alert('Sorry — the PDF could not be generated. '+(e&&e.message?e.message:''));
  }finally{
    if(btn){btn.disabled=false;btn.textContent=label||t('dl_pdf');}
  }
}

    <p style="color:var(--mut);font-size:11.5px;margin-top:10px">Current pricing at this ${cfg.chapter.scope}'s member count: dedicated send <strong class="num">${fmt(newsSendPrice())}</strong> · feature <strong class="num">${fmt(newsFeatPrice())}</strong>. The AI Collective Daily (national, 290K readers) is HQ inventory — see the separate media kit.</p>
  </div></details>
  <details><summary>Stipend rates</summary><div class="inner">
    <div style="color:var(--mut);font-size:11px;margin-bottom:8px">Paid as stipends on cash received, only after approval by ${esc(cfg.org.fiscal||'the fiscal sponsor')}. Insiders (directors, officers, or anyone with control) are not eligible for percentage-based stipends; percentage amounts should be capped at a reasonable level.</div>
    <div class="grid4">
      <div class="fg"><label>Member (referral)</label><input type="number" min="0" max="100" value="${cm.member}" onchange="cfg.comm.member=Number(this.value)||0;saveCfg()"></div>
      <div class="fg"><label>Salesperson (on referral)</label><input type="number" min="0" max="100" value="${cm.salesRef}" onchange="cfg.comm.salesRef=Number(this.value)||0;saveCfg()"></div>
      <div class="fg"><label>Salesperson (self-sourced)</label><input type="number" min="0" max="100" value="${cm.salesSrc}" onchange="cfg.comm.salesSrc=Number(this.value)||0;saveCfg()"></div>
      <div class="fg"><label>Region support (regional deals)</label><input type="number" min="0" max="100" value="${cm.region}" onchange="cfg.comm.region=Number(this.value)||0;saveCfg()"></div>
      <div class="fg"><label>Per-stipend cap (USD) — 0 = no cap</label><input type="number" min="0" value="${cm.capUsd||0}" onchange="cfg.comm.capUsd=Number(this.value)||0;saveCfg();renderComm()"></div>
    </div>
  </div></details>
  <div class="toolrow" style="margin-top:16px">
    <button class="btn btn-sec" onclick="exportCfg()">Export configuration</button>
    <button class="btn btn-sec" onclick="document.getElementById('impFile').click()">Import configuration</button>
    <input type="file" id="impFile" accept=".json" style="display:none" onchange="importCfg(this)">
    <span class="spacer"></span>
    <button class="btn btn-ghost" onclick="if(confirm('Reset all settings and pricing to defaults?')){localStorage.removeItem(CFG_KEY);cfg=loadCfg();rerenderAll();syncLangSel();}">Reset to defaults</button>
  </div>`;
}
function uploadLogo(inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>400*1024){alert('Logo is over 400KB — please export a smaller PNG/SVG so documents stay fast.');inp.value='';return;}
  const r=new FileReader();
  r.onload=()=>{cfg.chapter.logo=r.result;saveCfg();renderSettings();};
  r.readAsDataURL(f);
}
function uploadPhoto(inp,setter,maxW){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const scale=Math.min(1,(maxW||1500)/img.width);
      const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      let out=cv.toDataURL('image/jpeg',0.82);
      if(out.length>1400000)out=cv.toDataURL('image/jpeg',0.68);
      try{setter(out);saveCfg();}
      catch(e){alert('Storage is full — remove another image or use a smaller file.');return;}
      renderSettings();
    };
    img.onerror=()=>alert('That file could not be read as an image.');
    img.src=r.result;
  };
  r.readAsDataURL(f);
}
function addChapterPhoto(inp){
  if(!Array.isArray(cfg.chapter.photos3))cfg.chapter.photos3=[];
  if(cfg.chapter.photos3.length>=3){inp.value='';return;}
  uploadPhoto(inp,v=>{cfg.chapter.photos3.push(v);},1400);
}
function removeChapterPhoto(i){cfg.chapter.photos3.splice(i,1);saveCfg();renderSettings();}
function uploadOrgLogo(inp){
  const f=inp.files[0];if(!f)return;
  if(f.size>400*1024){alert('Logo is over 400KB — please export a smaller PNG so documents stay fast.');inp.value='';return;}
  const r=new FileReader();
  r.onload=()=>{cfg.org.logo=r.result;saveCfg();renderBrand();renderSettings();};
  r.readAsDataURL(f);
}
function renderBrand(){const el=document.getElementById('brandmark');if(el)el.innerHTML=brandMark(30);}
function setMultCap(k,i,v){cfg['mults'+k][i][0]=(v===''?null:Number(v));saveCfg();}
function delMult(k,i){cfg['mults'+k].splice(i,1);saveCfg();renderSettings();}
function addMult(k){cfg['mults'+k].splice(Math.max(cfg['mults'+k].length-1,0),0,[1000,1]);saveCfg();renderSettings();}
function exportCfg(){
  const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=(cfg.chapter.name||'aic').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-config.json';
  a.click();URL.revokeObjectURL(a.href);
}
function importCfg(inp){
  const f=inp.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const c=JSON.parse(r.result);
    cfg={org:{...DEFAULTS.org,...c.org},chapter:{...DEFAULTS.chapter,...c.chapter},comm:{...DEFAULTS.comm,...c.comm},
      multsC:c.multsC||DEFAULTS.multsC,multsR:c.multsR||DEFAULTS.multsR,
      annual:c.annual||DEFAULTS.annual,events:c.events||DEFAULTS.events};
    saveCfg();rerenderAll();syncLangSel();}catch(e){alert('Invalid configuration file.');}};
  r.readAsText(f);inp.value='';
}

function syncLangSel(){
  const s=document.getElementById('langSel');
  s.innerHTML=Object.keys(T).map(l=>`<option value="${l}" ${cfg.chapter.lang===l?'selected':''}>${LANG_NAMES[l]}</option>`).join('');
}
document.getElementById('langSel').addEventListener('change',e=>{cfg.chapter.lang=e.target.value;saveCfg();rerenderAll();});
syncLangSel();
renderBrand();
applyDir();
go('calc');
reportUsageOnce();
</script>
